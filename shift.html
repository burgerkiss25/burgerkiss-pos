<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BurgerKiss – Daily Sales</title>
  <link rel="stylesheet" href="./style.css?v=53" />
  <script src="./firebase-config.js?v=2"></script>
  <style>
    body.shift-app{min-height:100dvh;background:radial-gradient(circle at top left,#161b22 0,#090a0f 42%,#07080c 100%);color:#f7f8fb}.shift-wrap{width:min(1280px,100%);margin:0 auto;padding:18px}.shift-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:-18px -18px 18px;padding:12px 18px;border-bottom:1px solid #27303b;background:rgba(9,11,16,.96);backdrop-filter:blur(14px)}.shift-brand{display:flex;align-items:center;gap:12px}.shift-brand h1{margin:0;font-size:22px}.shift-brand small{display:block;color:#9eabba}.shift-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.shift-page{display:grid;gap:14px}.shift-card{padding:18px;border:1px solid #303948;border-radius:16px;background:#10151d}.shift-card h2{margin:0;color:#fff2c7}.shift-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.shift-toolbar input{min-height:40px;padding:8px;border:1px solid #384356;border-radius:9px;background:#101620;color:#edf3fa}.daily-report .report-orders{max-height:280px;overflow:auto;padding-right:4px}.daily-report button.report-order{width:100%;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}@media(max-width:900px){.shift-header{position:static;align-items:flex-start;flex-direction:column}.shift-actions{width:100%}.shift-actions .x{flex:1}.daily-report .report-orders{max-height:none}}
  </style>
</head>
<body class="shift-app app-loading">
  <main class="shift-wrap">
    <header class="shift-header">
      <div class="shift-brand"><div class="brand-mark">BK</div><div><h1>Daily Sales</h1><small>Closeout, wallet and order audit</small></div></div>
      <div class="shift-actions"><button class="x" id="historyToday" type="button">Today</button><button class="x" id="historyYesterday" type="button">Yesterday</button><button class="x" id="purchaseHistoryExport" type="button">Export purchases CSV</button><a class="x admin-primary" href="purchases.html">Add purchase</a><a class="x" href="order.html?start=walkin">Order</a><a class="x" href="index.html">Start</a><div class="staff-session" id="staffSession" aria-live="polite"></div></div>
    </header>
    <section class="shift-page">
      <article class="shift-card daily-sales-card">
        <div class="shift-toolbar"><div><h2>Daily closeout</h2><small>The BurgerKiss purse must start each shift with 200 GHS change.</small></div><input id="shiftReportDate" type="date" /></div>
        <div id="shiftReportBody"></div>
      </article>
    </section>
  </main>

  <div class="modal" id="shiftOrderDetailModal">
    <div class="sheet">
      <header><b id="shiftOrderDetailTitle">Order detail</b><div><button class="x" id="shiftOrderDetailClose" type="button">Close</button></div></header>
      <div class="body" id="shiftOrderDetailBody"></div>
    </div>
  </div>

  <script>
    if(!window.FIREBASE_CONFIG){
      console.warn('Firebase config missing: online database is disabled until firebase-config.js is filled.');
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="./access.js?v=4"></script>
  <script src="./stock_data.js?v=14"></script>
  <script src="./stock_utils.js?v=15"></script>
  <script src="./stock.js?v=22"></script>
  <script src="./shift_reports.js?v=5"></script>
  <script src="./shift.js?v=4"></script>
  <script>BK_STOCK.load(); BK_ACCESS.init();</script>
</body>
</html>
