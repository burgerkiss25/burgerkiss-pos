<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#090a0f" />
  <title>BurgerKiss – Start Order</title>
  <style>
    :root{color-scheme:dark;--accent:#ffd24d;--ink:#f7f8fb;--muted:#aeb7c4;--line:#2a303b}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top left,#1b1720 0,#090a0f 38%,#07080c 100%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
    main{width:min(680px,100%);padding:clamp(28px,6vw,52px);border:1px solid var(--line);border-radius:24px;background:rgba(16,18,24,.96);box-shadow:0 28px 70px rgba(0,0,0,.42);text-align:center}
    .brand{width:64px;height:64px;margin:0 auto 22px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,var(--accent),#ff8f1f);box-shadow:0 14px 30px rgba(255,191,31,.24);color:#201300;font-size:20px;font-weight:950}
    .eyebrow{margin:0;color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:8px 0 10px;font-size:clamp(34px,7vw,52px);line-height:1.05}
    .copy{margin:0;color:#c0c9d6;font-size:clamp(16px,2.5vw,19px)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}
    .action{min-height:76px;display:grid;place-items:center;padding:14px 18px;border:1px solid #d2a91f;border-radius:14px;background:var(--accent);color:#211700;text-decoration:none;font-size:18px;font-weight:950;box-shadow:0 10px 24px rgba(0,0,0,.2)}
    .action.online{border-color:#2d8bab;background:#123244;color:#d8f7ff}
    .action:focus-visible{outline:3px solid #7eb4ff;outline-offset:3px}
    @media(max-width:560px){body{padding:12px}main{padding:28px 18px}.actions{grid-template-columns:1fr}.action{min-height:66px}}
  </style>
</head>
<body>
  <main aria-labelledby="welcomeTitle">
    <div class="brand" aria-hidden="true">BK</div>
    <p class="eyebrow">Welcome to BurgerKiss</p>
    <h1 id="welcomeTitle">Start an order</h1>
    <p class="copy">Choose how the customer placed this order.</p>
    <div class="actions">
      <a class="action" href="order.html?start=walkin">Walk-in Order</a>
      <a class="action online" href="order.html?start=online">Online Order</a>
    </div>
  </main>
</body>
</html>
