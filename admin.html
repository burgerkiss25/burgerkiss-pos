<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BurgerKiss – Admin Editors</title>
  <link rel="stylesheet" href="./style.css?v=44" />
  <script src="./firebase-config.js?v=2"></script>
</head>
<body class="admin-page">
  <div class="staff-session admin-session" id="staffSession" aria-live="polite"></div>
  <div class="hud-wrap admin-hud">
    <header class="admin-header">
      <div class="brand-block admin-brand" aria-label="BurgerKiss admin editors">
        <div class="brand-mark">BK</div>
        <div>
          <div class="eyebrow">BurgerKiss POS</div>
          <h1>Admin Editors</h1>
        </div>
      </div>
      <nav class="admin-actions" aria-label="Admin editor navigation">
        <a class="x" href="index.html">← Back to POS</a>
        <button class="x" id="btnPrices" type="button">Edit Prices</button>
        <button class="x" id="btnProducts" type="button">Edit Products</button>
        <button class="x" id="btnMenus" type="button">Edit Menus</button>
        <button class="x" id="btnImages" type="button">Edit Images</button>
        <button class="x" id="btnStock" type="button">Edit Stock</button>
        <button class="x" id="btnIngredients" type="button">Edit Ingredients</button>
        <button class="x" id="btnRecipes" type="button">Edit Product Recipes</button>
        <button class="x" id="btnAddons" type="button">Edit Add-ons</button>
        <button class="x" id="btnPackagingRules" type="button">Packaging Rules</button>
      </nav>
    </header>
  </div>

  <div class="wrap">
    <section>
      <div class="panel">
        <h3>Editor area</h3>
        <p class="muted-copy">Use the buttons above to open Price/Product/Image/Stock editors.</p>
      </div>
      <div class="panel" id="adminDbStatusPanel">
        <div class="slot-head">
          <div><span class="label">Online DB Status</span> · Firebase Realtime Database</div>
          <button class="x" id="btnRefreshDbStatus" type="button">Refresh</button>
        </div>
        <div class="rows" id="adminDbStatusBody">
          <div class="empty-state">Checking Firebase status...</div>
        </div>
      </div>
    </section>
  </div>

  <div class="modal" id="modalPrices"><div class="sheet"><header><b>Edit Prices</b><div><button class="x" id="pSave">Save</button><button class="x" id="pReset">Reset</button><button class="x" id="pClose">Close</button></div></header><div class="body" id="pricesBody"></div></div></div>
  <div class="modal" id="modalProducts"><div class="sheet"><header><b>Edit Products</b><div><button class="x" id="prodAdd">+ Add</button><button class="x" id="prodSave">Save</button><button class="x" id="prodReset">Reset</button><button class="x" id="prodClose">Close</button></div></header><div class="body" id="productsBody"></div></div></div>
  <div class="modal" id="modalMenus"><div class="sheet"><header><b>Edit Menus</b><div><button class="x" id="menuAdd">+ Add</button><button class="x" id="menuSave">Save</button><button class="x" id="menuReset">Reset</button><button class="x" id="menuClose">Close</button></div></header><div class="body" id="menusBody"></div></div></div>
  <div class="modal" id="modalImages"><div class="sheet"><header><b>Edit Images</b><div><button class="x" id="iSave">Save</button><button class="x" id="iReset">Reset</button><button class="x" id="iClose">Close</button></div></header><div class="body" id="imagesBody"></div></div></div>
  <div class="modal" id="modalStock"><div class="sheet"><header><b id="stockModalTitle">Edit Stock</b><div><button class="x" id="sSave">Save</button><button class="x" id="sReset">Reset</button><button class="x" id="sClose">Close</button></div></header><div class="body" id="stockBody"></div></div></div>
  <div class="modal" id="modalPackagingRules"><div class="sheet"><header><b>Packaging Rules</b><div><button class="x" id="packSave">Save</button><button class="x" id="packReset">Reset</button><button class="x" id="packClose">Close</button></div></header><div class="body" id="packagingRulesBody"></div></div></div>

  <script>
    if(!window.FIREBASE_CONFIG){
      console.warn('Firebase config missing: admin online database saves are disabled until firebase-config.js is filled.');
    }
  </script>

  <!-- Firebase SDK (Compat) for Admin online saves -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script src="./access.js?v=1"></script>
  <script src="./data.js?v=13"></script>
  <script src="./prices.js?v=14"></script>
  <script src="./products.js?v=14"></script>
  <script src="./menus.js?v=2"></script>
  <script src="./images.js?v=18"></script>
  <script src="./stock_data.js?v=13"></script>
  <script src="./stock_utils.js?v=15"></script>
  <script src="./stock.js?v=18"></script>
  <script src="./state.js?v=19"></script>
  <script src="./logic.js?v=14"></script>
  <script src="./ui.js?v=44"></script>
  <script>
    document.addEventListener('bk-access-ready', function(){
      if(!BK_ACCESS.hasRole('owner')){
        window.location.replace('index.html');
        return;
      }
      if(document.querySelector('script[data-admin-boot]')) return;
      const script = document.createElement('script');
      script.src = 'admin.js?v=2';
      script.dataset.adminBoot = 'true';
      document.body.appendChild(script);
    });
    BK_ACCESS.init();
  </script>
</body>
</html>
